<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>lecture-copilot</title>
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
  <header class="topbar">
    <h1 class="brand">lecture-copilot</h1>
    <span class="lecture-title" id="lecture-title">새 강의</span>
    <span class="mode-badge" id="mode-badge" title="stt·rag·data 연동 전까지 가짜 데이터로 동작합니다">MOCK 모드</span>
  </header>

  <main class="layout">
    <!-- 왼쪽: 강의자료 영역 -->
    <section class="pane viewer" id="viewer" aria-label="강의자료"></section>

    <!-- 오른쪽: 녹음 상태 · 메모 · 질문답변 -->
    <aside class="side">
      <section class="pane recorder" id="recorder" aria-label="녹음 상태"></section>
      <section class="pane notes" id="notes" aria-label="메모"></section>
      <section class="pane qa" id="qa" aria-label="질문과 답변"></section>
    </aside>
  </main>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
